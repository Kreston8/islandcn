name: Build Android APK

# islandcn is a Next.js site plus a shadcn registry, so there is no Android project upstream.
# This workflow builds the native overlay island in android/ and publishes the APK to a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (leave empty for island-v2.14.<run number>)"
        required: false
        default: ""
  push:
    branches: [android-apk]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ensure SDK platform
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMAN" ]; then
            "$SDKMAN" --install "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Restore the pinned signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/island.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/island.p12" >> "$GITHUB_ENV"
            echo "Pinned key restored: the APK installs over previous versions."
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, falling back to the debug key. This APK needs a clean install."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionCode="${{ github.run_number }}" \
          -PversionName="2.14.${{ github.run_number }}"

      # Advisory only: the artifact is verified locally afterwards, this just says which key signed it.
      - name: Check the signing certificate
        continue-on-error: true
        run: |
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee cert.txt || true
          if grep -q "CN=Android Debug" cert.txt 2>/dev/null; then
            echo "::warning::APK is debug-signed; it cannot update an earlier pinned-key build."
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
          "dist/islandcn-island-2.14.${{ github.run_number }}.apk"
          ls -l dist
          unzip -l dist/*.apk | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: islandcn-island-apk
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="island-v2.14.${{ github.run_number }}"; fi
          cat > notes.md <<'NOTES'
          ## English

          **What is new in this build**
          - **The app is called 岛仔 now**, with its own icon: one white capsule, two round eyes, one smile, drawn for this app and not borrowed from anyone. Nothing else changed identity: the package name stays the same, so this installs straight over the previous version and keeps your settings. The old name used a term that belongs to someone else, which is a needless risk for a public download.
          - **The settings page is half a screen shorter.** Each permission is now one line — title, its "?" right beside the title, and 去授权 pinned to the right edge — with the status underneath. The service card got the same treatment: 运行状态 and the start/stop button share a line, 预览效果 moved to a quiet link on the right.
          - **The temperature tap opens the phone's own weather app now.** The real cause was Android 11 package visibility: without a `<queries>` block the launcher lookup for 小米天气 answers null, so the tap fell through to the web page every single time. The manifest declares it, and the tap now tries the exact MIUI activities by name before any package lookup, then scans launcher labels for anything called 天气, and only then falls back to the browser.
          - **The connected-device list is read through public APIs.** The old path called a hidden `BluetoothManager.getConnectedDevices(int)`, which Android 12+ is free to refuse — that is why the Bluetooth card could stay empty on a phone that was plainly playing music over A2DP. The list now merges three sources: the hidden call (kept, it is free when it works), an asynchronous A2DP/HEADSET/GATT profile proxy with an 8-second cache, and paired devices that already report a battery. The diagnostics line now starts with the CONNECT/SCAN permission state and says which source produced the list.

          **Supported systems** — Android 8.0 and newer, built against Android 14. One universal APK: plain Java, no `lib/`. Reference family: 小米 / 红米 / POCO on MIUI 12-14 or HyperOS; MIUI also needs 后台弹出界面, and for 岛仔 to stay up after you leave the app it needs 自启动 with an unrestricted 省电策略. Limits worth knowing: Android 12 and newer forbids starting a foreground service from the background, so the 15-minute watchdog can only bring the island back when the app is exempt from battery optimisation; tapping the temperature needs 后台弹出界面 to be on, because MIUI silently drops an activity started from a background process; a classic-only headset has no GATT server to read, and some buds only report battery over the vendor's own channel, so the chip may show an icon without a number — send me the diagnostic line and I can tell you which case you are in; Open-Meteo's geocoder does not list every Chinese district, which is why the resolved label is printed for you to check; and an SMS card opens the conversation, not one single message. Four hosts are reached, and only when used: geocoding-api.open-meteo.com / api.open-meteo.com / air-quality-api.open-meteo.com for the typed city, music.163.com for lyrics. Permissions, limits and the switch table live in the README: [English](https://github.com/Kreston8/islandcn/blob/android-apk/android/README.md) · [中文](https://github.com/Kreston8/islandcn/blob/android-apk/android/README.zh.md)

          ## 中文

          **本次更新**
          - **应用改名叫「岛仔」了**，图标也换成自己的：一颗白胶囊、两只圆眼、一个笑，自己画的，没借任何人的图形。除此之外身份没变：包名不动，所以可以直接覆盖升级，设置都还在。原来的名字用了属于别人的词汇，公开分发是没必要的风险。
          - **设置页矮了将近一屏。** 每条权限现在只占一行——标题、紧挨着标题的「?」、最右侧的「去授权」，状态压在下面一行；运行状态卡片同样处理：运行状态和启停按钮并排，预览效果收到右侧做个小链接。
          - **点温度现在真的打开手机自带的天气应用。** 真正的原因是 Android 11 起的包可见性：没有 `<queries>` 声明，查小米天气的启动入口一律返回空，所以每次都会掉到网页兜底。现在清单里声明了，点击时先按 Activity 全名直呼小米天气，再按包名查，再扫一遍启动器里叫「天气」的应用，最后才是浏览器。
          - **已连接设备列表改走公开接口。** 原来调用的是隐藏的 `BluetoothManager.getConnectedDevices(int)`，Android 12 起系统有权直接拒绝——这就是明明在用 A2DP 放歌、蓝牙卡片却空着的原因。现在列表合并三个来源：老接口（留着，能用就是白捡）、A2DP/HEADSET/GATT 的 profile 代理异步查询（带 8 秒缓存）、以及已经能报出电量的配对设备。诊断行开头会写 CONNECT/SCAN 权限状态，末尾写明这次的列表是哪个来源给出的。

          **支持的系统** — Android 8.0 及以上，按 Android 14 编译。只有一个通用安装包：纯 Java、没有 `lib/`。主要适配小米 / 红米 / POCO 的 MIUI 12–14 与 HyperOS；MIUI 还需开启「后台弹出界面」，而想让岛仔在你退出应用后继续活着，还要开「自启动」并把「省电策略」设为无限制。要提前知道的限制：Android 12 起禁止后台启动前台服务，所以 15 分钟的看门狗只有在应用已忽略电池优化时才能把岛仔拉回来；点温度需要「后台弹出界面」已开启，否则 MIUI 会静默丢弃后台进程发起的页面跳转；纯经典蓝牙耳机没有 GATT 服务可读，有些耳机只在自己的私有通道里报电量，所以芯片可能只有图标没有数字——把诊断那行发我，我能判断你属于哪种；Open-Meteo 的地理编码没有收录国内每一个区，所以界面上会把解析结果显示出来让你自己核对；短信卡片打开的是会话，不是某一条。只访问四个域名，且只在用到时才访问：geocoding-api.open-meteo.com / api.open-meteo.com / air-quality-api.open-meteo.com（手填城市才会连）与 music.163.com（联网歌词）。权限、限制和开关说明都在 README：[中文](https://github.com/Kreston8/islandcn/blob/android-apk/android/README.zh.md) · [English](https://github.com/Kreston8/islandcn/blob/android-apk/android/README.md)
          NOTES
          echo "Publishing $TAG"
          gh release create "$TAG" dist/*.apk --title "islandcn 灵动岛 $TAG" --notes-file notes.md \
            || gh release upload "$TAG" dist/*.apk --clobber
