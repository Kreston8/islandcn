name: Build Android APK

# islandcn is a Next.js site plus a shadcn registry, so there is no Android project upstream.
# This workflow builds the native overlay island in android/ and publishes the APK to a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (leave empty for island-v2.13.<run number>)"
        required: false
        default: ""
  push:
    branches: [android-apk]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ensure SDK platform
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMAN" ]; then
            "$SDKMAN" --install "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Restore the pinned signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/island.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/island.p12" >> "$GITHUB_ENV"
            echo "Pinned key restored: the APK installs over previous versions."
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, falling back to the debug key. This APK needs a clean install."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionCode="${{ github.run_number }}" \
          -PversionName="2.13.${{ github.run_number }}"

      # Advisory only: the artifact is verified locally afterwards, this just says which key signed it.
      - name: Check the signing certificate
        continue-on-error: true
        run: |
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee cert.txt || true
          if grep -q "CN=Android Debug" cert.txt 2>/dev/null; then
            echo "::warning::APK is debug-signed; it cannot update an earlier pinned-key build."
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
          "dist/islandcn-island-2.13.${{ github.run_number }}.apk"
          ls -l dist
          unzip -l dist/*.apk | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: islandcn-island-apk
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="island-v2.13.${{ github.run_number }}"; fi
          cat > notes.md <<'NOTES'
          ## English

          **What is new in this build**
          - **The island now survives leaving the app.** Closing the settings screen could take the island with it. The service is sticky, it keeps its window alive when the task is removed, and a 15-minute watchdog restarts it after a ROM has quietly killed it. It also comes back after a reboot or an update, but only if it was running when the app was last closed. A new card, 后台常驻, shows whether the app is exempt from battery optimisation and offers both switches: ignore battery optimisation, and the MIUI page for 自启动 / 省电策略.
          - **A tidier Settings screen.** The long paragraph under the title and the six permission blurbs are folded away behind a round "?" button. The permission state itself still shows at a glance.
          - **The smiling eyes were too close.** They touched; the gap is now about a fifth of the eye box.
          - **Tapping the temperature or the AQI badge opens the weather app** — MIUI weather first, then a few other ROMs, then weather.miui.com in a browser.
          - **Long-press on the standby pill finally does something.** Hold it and it shivers; swipe up while it shivers and it disappears for three minutes, then comes back by itself. The same hold-and-swipe works on the notification card, and the shiver is actually visible: the window now has slack on both sides, so the card moves inside it instead of being clipped by it.
          - **Lyrics are steadier.** A failed lookup no longer poisons that track for the rest of the session; a late answer is stored instead of thrown away; the drift allowance is 400 ms instead of 700; and while timed lyrics are on, the playback position is re-read every second. Retries back off 15 s, 30 s, 60 s, so a track with no lyrics anywhere does not turn into a network loop.
          - **Baseus earbud battery.** When the classic A2DP accessory has no readable battery, the app now looks for the same device over BLE: a GATT read of the standard battery service and a notification subscription, whichever answers first, plus — when the BLE address differs from the classic one, which is normal on TWS — an 8-second name-matched scan to find the twin. Bowie M2 is recognised by name as well.

          **Supported systems** — Android 8.0 and newer, built against Android 14. One universal APK: plain Java, no `lib/`. Reference family: 小米 / 红米 / POCO on MIUI 12-14 or HyperOS; MIUI also needs 后台弹出界面, and for the island to stay up after you leave the app it needs 自启动 with an unrestricted 省电策略. Signing is unchanged, so this installs straight over 2.12.23. Limits worth knowing: Android 12 and newer forbids starting a foreground service from the background, so the watchdog can only bring the island back when the app is exempt from battery optimisation — that is what the new card is for; a classic-only headset has no GATT server to read and some ROMs block the hidden platform method, so some devices can only show an icon; Open-Meteo's geocoder does not list every Chinese district, which is why the resolved label is printed for you to check; and an SMS card opens the conversation, not one single message. Four hosts are reached, and only when used: geocoding-api.open-meteo.com / api.open-meteo.com / air-quality-api.open-meteo.com for the typed city, music.163.com for lyrics. Permissions, limits and the switch table live in the README: [English](https://github.com/Kreston8/islandcn/blob/android-apk/android/README.md) · [中文](https://github.com/Kreston8/islandcn/blob/android-apk/android/README.zh.md)

          ## 中文

          **本次更新**
          - **退出应用，灵动岛不再跟着消失。** 服务改成常驻粘性，任务被划掉时不拆窗口，另有一个 15 分钟的看门狗，被系统悄悄杀掉后自己把它拉回来；重启手机或覆盖安装后也会恢复，但只在你上次是开着它的情况下恢复。设置页新增「后台常驻」卡片：显示是否已忽略电池优化，并提供「忽略电池优化」和「应用设置」（自启动 / 省电策略）两个按钮。
          - **设置页收干净了。** 大标题下那一段介绍、以及六个权限的小字说明，全部折进标题右边一个圆形「?」按钮里；权限本身有没有给，仍然一眼能看到。
          - **弯眼睛分开了。** 原来两只眼连在一起，现在中间留出约五分之一眼框的缝。
          - **点温度或空气质量标识，现在会打开天气应用** —— 先试小米天气，再试几家的天气应用，都不行就用浏览器打开 weather.miui.com。
          - **常驻胶囊的长按终于有用了。** 长按住它会抖动，此时上滑就消失三分钟，到点自己回来。通知卡片同样支持长按抖动+上滑隐藏，而且这次真的看得见：窗口两侧留了余量，卡片在窗口里移动，不再被自己的窗口裁掉。
          - **歌词稳了一些。** 取词失败不再把这首歌永久钉死；迟到的答案会存下来而不是丢掉；播放进度的容差从 700 ms 收紧到 400 ms；开着逐字歌词时，每秒重新读一次播放进度。失败重试按 15 秒、30 秒、60 秒退避，没歌词的曲子不会变成网络空转。
          - **倍思耳机电量。** 经典蓝牙（A2DP）读不到电量时，现在会按同一个名字去 BLE 上找它的另一面：先读标准电量服务，再订阅电量变化通知，谁先回就用谁；如果 BLE 地址和经典地址不一样（TWS 很常见），再做一次 8 秒的名字匹配扫描去找那一路。倍思 Bowie M2 也按名字认了。

          **支持的系统** — Android 8.0 及以上，按 Android 14 编译。只有一个通用安装包：纯 Java、没有 `lib/`。主要适配小米 / 红米 / POCO 的 MIUI 12–14 与 HyperOS；MIUI 还需开启「后台弹出界面」，而想让灵动岛在你退出应用后继续活着，还要开「自启动」并把「省电策略」设为无限制。签名未变，可直接覆盖 2.12.23 安装。要提前知道的限制：Android 12 起禁止后台启动前台服务，所以看门狗只有在应用已忽略电池优化时才能把灵动岛拉回来——这就是新卡片的作用；纯经典蓝牙耳机没有 GATT 服务可读，部分 ROM 又会拦下隐藏的系统接口，所以有些设备只能显示图标；Open-Meteo 的地理编码并没有收录国内每一个区，所以界面上会把解析结果显示出来让你自己核对；短信卡片打开的是会话，不是某一条。只访问四个域名，且只在用到时才访问：geocoding-api.open-meteo.com / api.open-meteo.com / air-quality-api.open-meteo.com（手填城市才会连）与 music.163.com（联网歌词）。权限、限制和开关说明都在 README：[中文](https://github.com/Kreston8/islandcn/blob/android-apk/android/README.zh.md) · [English](https://github.com/Kreston8/islandcn/blob/android-apk/android/README.md)
          NOTES
          echo "Publishing $TAG"
          gh release create "$TAG" dist/*.apk --title "islandcn 灵动岛 $TAG" --notes-file notes.md \
            || gh release upload "$TAG" dist/*.apk --clobber
