name: Build Android APK

# islandcn is a Next.js site plus a shadcn registry, so there is no Android project upstream.
# This workflow builds the native overlay island in android/ and publishes the APK to a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (leave empty for island-v2.12.<run number>)"
        required: false
        default: ""
  push:
    branches: [android-apk]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ensure SDK platform
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMAN" ]; then
            "$SDKMAN" --install "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Restore the pinned signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/island.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/island.p12" >> "$GITHUB_ENV"
            echo "Pinned key restored: the APK installs over previous versions."
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, falling back to the debug key. This APK needs a clean install."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionCode="${{ github.run_number }}" \
          -PversionName="2.12.${{ github.run_number }}"

      # Advisory only: the artifact is verified locally afterwards, this just says which key signed it.
      - name: Check the signing certificate
        continue-on-error: true
        run: |
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee cert.txt || true
          if grep -q "CN=Android Debug" cert.txt 2>/dev/null; then
            echo "::warning::APK is debug-signed; it cannot update an earlier pinned-key build."
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
          "dist/islandcn-island-2.12.${{ github.run_number }}.apk"
          ls -l dist
          unzip -l dist/*.apk | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: islandcn-island-apk
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="island-v2.12.${{ github.run_number }}"; fi
          cat > notes.md <<'NOTES'
          ## English

          **What is new in this build**
          - **The island no longer folds open and shut.** It is one pill, one height, and its width follows its text — longer for a delivery, shorter for a code. That removed the tap-to-expand card, the × button and the touch target that used to grow under your finger.
          - **Gestures, in the order you meet them.** One tap opens the app. Two taps copy. Left swipe closes that card for good. A plain upward swipe pages through whatever is taking turns — several pickup codes, the newest notification, the desktop line, the lyric line. Long-press makes the pill shake, and an upward swipe from there hides it for three minutes; it comes back by itself.
          - **Two taps copy only what is worth copying**: a pickup code (the code alone, without the 驿站 name around it) or the line of the day. Nothing else responds to it.
          - **Closing is permanent.** A card you swipe away never comes back, not even after the service restarts. The one exception is a track: only the card on screen is dropped, because the next song should still show.
          - **Do-not-disturb is respected.** While the phone is in DND, priority-only or silent, notifications, pickup codes, delivery, to-dos, calls and alarms stay off the pill. The desktop line and the lyrics are not affected, and nothing that was held back is replayed when the mode ends.
          - **Cards that arrive while another app is in front are dropped as well**, and they do not reappear when you get back to the desktop. This uses 使用情况访问; without that permission the island behaves as it did before.
          - **The clock app's own bedtime notices stay off the island.** They repeat what the alarm reminder already says.
          - **Alarms remind three times: T-10, T-5 and T-1 minutes**, five seconds each, and then the pill goes back to the desktop line, or to the lyrics if a track is playing. After T nothing is shown, because the system clock rings on its own. A left swipe cancels the rest of that one alarm; tomorrow's alarm is untouched. Tapping an alarm card opens the clock app's alarm list.
          - **The line of the day scrolls like a sign when it is too long**, and copying it copies the sentence alone — no temperature glued to the end.
          - **Settings**: 附近设备 (Bluetooth) moved up next to the other four permissions; the colour swatches scroll sideways, so the last tint is finally reachable; and a diagnostics line under the Bluetooth card says which profiles an accessory is actually connected on and where its battery figure would come from. Earbuds that only register A2DP — Baseus Bowie M2 among them — now appear at all.
          - The mascot's smiling eyes were drawn upside down. Fixed.

          **Supported systems** — Android 8.0 and newer, built against Android 14. One universal APK: plain Java, no `lib/`. Reference family: 小米 / 红米 / POCO on MIUI 12-14 or HyperOS; MIUI also needs 后台弹出界面. Signing is unchanged, so this installs straight over 2.11.21. Limits worth knowing: the accessory battery path starts with a hidden platform method some ROMs block, and a classic-only headset has no GATT server to read, so some devices can only show an icon; Open-Meteo's geocoder does not list every Chinese district, which is why the resolved label is printed for you to check; and an SMS card opens the conversation, not one single message. Four hosts are reached, and only when used: geocoding-api.open-meteo.com / api.open-meteo.com / air-quality-api.open-meteo.com for the typed city, music.163.com for lyrics. Permissions, limits and the switch table live in the README: [English](https://github.com/Kreston8/islandcn/blob/android-apk/android/README.md) · [中文](https://github.com/Kreston8/islandcn/blob/android-apk/android/README.zh.md)

          ## 中文

          **本次更新**
          - **灵动岛不再展开/收起。** 只有一个高度固定的胶囊，宽度随文字自己变长变短——外卖长一点，验证码短一点。原来那套点击展开、按 × 关闭、以及手指底下会突然变大的触摸区，一起删掉了。
          - **手势按用法排列：** 单击打开应用；双击复制；左滑把这条消息永久关掉；不长按直接上滑，翻看正在轮换的东西——多个取件码、最新通知、桌面常驻、歌词。长按之后胶囊会抖动，此时上滑让它消失三分钟，到时候自己回来。
          - **双击只复制该复制的东西**：取件码（只拿码，不带驿站名）和每日一句。别的都不响应双击。
          - **关掉就是永久关掉。** 左滑过的卡片不会再回来，服务重启也不会。唯一的例外是音乐：只丢掉当前这张，下一首照常显示。
          - **免打扰期间不上岛。** 手机处于免打扰、仅优先或静音时，通知、取件码、外卖、待办、来电、闹钟都不显示；桌面常驻和歌词不受影响。免打扰结束的那一刻，被压下去的卡片也不补弹。
          - **在别的应用里来的卡片同样直接丢弃**，回到桌面也不补。这条依赖「使用情况访问」；没给这个权限时，行为跟以前一样。
          - **小米时钟自己发的作息提醒不上岛**，它说的和闹钟提醒重复。
          - **闹钟改成三次提醒：T-10、T-5、T-1 分钟**，每次显示 5 秒，然后回到桌面常驻；正在听歌时直接回到歌词。T 之后不再提醒，系统闹钟自己会响。左滑可以取消这一次闹钟剩下的提醒，明天的闹钟照常。点闹钟卡片打开的是时钟的闹钟列表。
          - **每日一句太长时像条幅一样滚动**，复制它只复制那句话，后面不再拖一串温度。
          - **设置页**：「附近设备（蓝牙）」上移到前四个权限旁边；颜色色板可以左右滑了，最后一块终于点得到；蓝牙卡下面多一行诊断，说明这台设备到底挂在哪几个 profile 上、电量该从哪儿读。只注册 A2DP 的无线耳机（包括倍思 Bowie M2）以前根本不出现，现在会显示。
          - 岛仔的弯眼睛以前画反了，已修正。

          **支持的系统** — Android 8.0 及以上，按 Android 14 编译。只有一个通用安装包：纯 Java、没有 `lib/`。主要适配小米 / 红米 / POCO 的 MIUI 12–14 与 HyperOS，MIUI 还需开启「后台弹出界面」。签名未变，可直接覆盖 2.11.21 安装。要提前知道的限制：蓝牙电量第一路是隐藏接口，部分 ROM 会拦，而纯经典蓝牙耳机没有 GATT 服务可读，所以有些设备只能显示图标；Open-Meteo 的地理编码并没有收录国内每一个区，所以界面上会把解析结果显示出来让你自己核对；短信卡片打开的是会话，不是某一条。只访问四个域名，且只在用到时才访问：geocoding-api.open-meteo.com / api.open-meteo.com / air-quality-api.open-meteo.com（手填城市才会连）与 music.163.com（联网歌词）。权限、限制和开关说明都在 README：[中文](https://github.com/Kreston8/islandcn/blob/android-apk/android/README.zh.md) · [English](https://github.com/Kreston8/islandcn/blob/android-apk/android/README.md)
          NOTES
          echo "Publishing $TAG"
          gh release create "$TAG" dist/*.apk --title "islandcn 灵动岛 $TAG" --notes-file notes.md \
            || gh release upload "$TAG" dist/*.apk --clobber
