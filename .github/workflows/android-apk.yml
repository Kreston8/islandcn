name: Build Android APK

# islandcn is a Next.js site plus a shadcn registry, so there is no Android project upstream.
# This workflow builds the native overlay island in android/ and publishes the APK to a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (leave empty for island-v2.4.<run number>)"
        required: false
        default: ""
  push:
    branches: [android-apk]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ensure SDK platform
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMAN" ]; then
            "$SDKMAN" --install "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Restore the pinned signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/island.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/island.p12" >> "$GITHUB_ENV"
            echo "Pinned key restored: the APK installs over previous versions."
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, falling back to the debug key. This APK needs a clean install."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="2.4.${{ github.run_number }}"

      # Advisory only: the artifact is verified locally afterwards, this just says which key signed it.
      - name: Check the signing certificate
        continue-on-error: true
        run: |
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee cert.txt || true
          if grep -q "CN=Android Debug" cert.txt 2>/dev/null; then
            echo "::warning::APK is debug-signed; it cannot update an earlier pinned-key build."
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/islandcn-island-2.4.${{ github.run_number }}.apk"
          ls -l dist
          unzip -l dist/*.apk | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: islandcn-island-apk
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="island-v2.4.${{ github.run_number }}"; fi
          cat > notes.md <<'NOTES'
          Native overlay island for Android: a SYSTEM_ALERT_WINDOW pill above other apps driven by a NotificationListenerService. SMS verification and pickup codes with one tap copy, delivery countdown, Mi Notes todo cards, incoming calls, a fifteen minute alarm heads up, navigation lines from whitelisted map apps, and a music strip. Every feature has its own switch in the app.

          This build: the music card is half the height of a normal card (44 dp) and shows only album art plus one line, which lights up character by character as the song is sung. It only appears on the desktop and disappears the moment any app opens, the player included. It also pins the release certificate, so later builds install straight over this one; as the first build with the new key it still needs one uninstall of 2.3.x.

          Honest note about the network: the lyric line is the only feature that opens a socket. It calls the public lyrics endpoint on music.163.com over HTTPS, once per track, only while the lyrics switch is on, capped at 512 KB and kept in memory only. That endpoint has one timestamp per line, so the per character highlight is interpolated inside the line and will not match every syllable. Turning the switch off removes the network use completely.
          NOTES
          echo "Publishing $TAG"
          gh release create "$TAG" dist/*.apk --title "islandcn 灵动岛 $TAG" --notes-file notes.md \
            || gh release upload "$TAG" dist/*.apk --clobber
